<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>toys · Nyasers</title>
    <meta name="description" content="一些小玩具：每个都能直接打开，也顺便讲清一件事。" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #faf8f4;
        --ink: #1b1a18;
        --muted: #6f6961;
        --line: #e3ded6;
        --card: #fffdfa;
        --accent: #b4552f;
        --pad: clamp(1.5rem, 6vw, 5rem);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #131211;
          --ink: #ece8e2;
          --muted: #8d867e;
          --line: #2b2825;
          --card: #1a1917;
          --accent: #e08b62;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        font-size: 16px;
        line-height: 1.7;
        -webkit-font-smoothing: antialiased;
      }
      main {
        max-width: 46rem;
        margin: 0 auto;
        padding: calc(var(--pad) * 1.1) var(--pad) var(--pad);
      }
      header h1 {
        margin: 0;
        font-size: clamp(2.2rem, 7vw, 3rem);
        font-weight: 600;
        letter-spacing: -0.03em;
        line-height: 1.1;
      }
      header p {
        margin: 0.75rem 0 0;
        max-width: 32rem;
        color: var(--muted);
      }
      .rule {
        margin: calc(var(--pad) * 0.9) 0 calc(var(--pad) * 0.5);
        border: 0;
        border-top: 1px solid var(--line);
      }
      ul.toys {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      ul.toys li + li {
        margin-top: 0.6rem;
      }
      a.toy {
        display: grid;
        grid-template-columns: 3.2rem 1fr auto;
        align-items: baseline;
        gap: 0.25rem 1rem;
        padding: 1.15rem 1.25rem;
        border: 1px solid transparent;
        border-radius: 10px;
        color: inherit;
        text-decoration: none;
        transition: background-color 140ms ease, border-color 140ms ease;
      }
      a.toy:hover,
      a.toy:focus-visible {
        background: var(--card);
        border-color: var(--line);
        outline: none;
      }
      .no {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
        font-size: 0.78rem;
        color: var(--muted);
        letter-spacing: 0.08em;
      }
      .name {
        font-size: 1.06rem;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      .desc {
        grid-column: 2;
        color: var(--muted);
        font-size: 0.94rem;
      }
      .tags {
        grid-column: 2;
        color: var(--muted);
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
        font-size: 0.72rem;
        letter-spacing: 0.04em;
        opacity: 0.85;
      }
      .go {
        grid-row: 1 / -1;
        grid-column: 3;
        align-self: center;
        color: var(--muted);
        transition: transform 140ms ease, color 140ms ease;
      }
      a.toy:hover .go,
      a.toy:focus-visible .go {
        color: var(--accent);
        transform: translateX(3px);
      }
      footer {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        margin-top: calc(var(--pad) * 0.9);
        padding-top: 1rem;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 0.8rem;
      }
      footer a {
        color: inherit;
        text-decoration: none;
        border-bottom: 1px solid var(--line);
      }
      footer a:hover {
        color: var(--ink);
        border-color: currentColor;
      }
      @media (max-width: 34rem) {
        a.toy {
          grid-template-columns: 2.4rem 1fr;
        }
        .go {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>toys</h1>
        <p>写来玩的小东西。每个都能直接打开，也顺便把一件事讲清楚。</p>
      </header>

      <hr class="rule" />

      <ul class="toys">
        <li>
          <a class="toy" href="./aaclock/">
            <span class="no">01</span>
            <span class="name">AAClock</span>
            <span class="desc"
              >反走样时钟。同一套几何、两条采样路径，加一个能看设备像素的放大镜。</span
            >
            <span class="tags">WEBGL2 · SDF · 解析覆盖 vs 超采样</span>
            <span class="go" aria-hidden="true">→</span>
          </a>
        </li>
        <li>
          <a class="toy" href="./four-leaf-pinwheel/">
            <span class="no">02</span>
            <span class="name">四叶风车</span>
            <span class="desc"
              >极坐标参数化、变换栈复制、时间驱动旋转，再挤出厚度做透视投影。</span
            >
            <span class="tags">CANVAS 2D · 参数曲线 · 画家算法</span>
            <span class="go" aria-hidden="true">→</span>
          </a>
        </li>
      </ul>

      <footer>
        <span>MPL-2.0</span>
        <a href="https://github.com/Nyasers/toys">源代码</a>
      </footer>
    </main>
  </body>
</html>
