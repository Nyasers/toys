<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="反走样时钟：同一套几何、两条采样路径、一个能看设备像素的放大镜。"
    />
    <title>反走样时钟 · AAClock</title>
    <link rel="manifest" href="../manifest.webmanifest" />
    <!-- 首帧之前把主题落上，避免先白一下再变色。与 ThemeProvider 的选择规则同一套。 -->
    <script>
      (() => {
        const KEY = 'toys:theme';
        const fromUrl = new URLSearchParams(location.search).get('theme');
        let pref = fromUrl || 'auto';
        if (!fromUrl) {
          try {
            pref = localStorage.getItem(KEY) || 'auto';
          } catch {
            /* 隐私模式下拿不到，按自动处理 */
          }
        }
        const dark = matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme =
          pref === 'auto' ? (dark ? 'midnight' : 'warm-paper') : pref;
      })();
    </script>
    <!-- 启动期抛错时不要只留一个空页：把原因贴在底部。 -->
    <script>
      addEventListener('error', (ev) => {
        const box = document.createElement('pre');
        box.style.cssText =
          'position:fixed;left:0;right:0;bottom:0;margin:0;padding:10px 14px;background:#8b3a3a;color:#fff;font:12px/1.5 ui-monospace,monospace;white-space:pre-wrap;z-index:9999';
        box.textContent = '启动失败：' + (ev.error?.stack || ev.message);
        document.body.appendChild(box);
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app.tsx"></script>
  </body>
</html>
